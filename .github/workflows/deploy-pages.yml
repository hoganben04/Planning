name: Deploy static apps to GitHub Pages

# One Pages site, two apps:
#   /                 -> Farm-Safety-Training-Pack/app  (unchanged URL)
#   /course-builder/  -> Bees-Course-Builder/app
#
# A repository gets exactly ONE Pages site, and each deployment replaces the whole
# of it. So both apps have to be assembled into a single artifact here — adding a
# second Pages workflow would mean the two taking turns to delete each other.

on:
  push:
    branches:
      - main
      - claude/farm-safety-training-pack-1v08gi
      - claude/horse-jumping-planner-ios-0ngx5z
    paths:
      - "Farm-Safety-Training-Pack/app/**"
      - "Bees-Course-Builder/app/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Enable Pages automatically on first run if it isn't already.
          enablement: true

      - name: Assemble the site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/course-builder
          # The trailing "/." copies dotfiles too, so .nojekyll comes along.
          cp -R Farm-Safety-Training-Pack/app/. _site/
          cp -R Bees-Course-Builder/app/. _site/course-builder/
          touch _site/.nojekyll _site/course-builder/.nojekyll
          echo "--- site tree ---"
          find _site -maxdepth 2 -printf '%P\n' | sort

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
