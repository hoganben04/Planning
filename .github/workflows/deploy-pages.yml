name: Deploy training app to GitHub Pages

# Publishes Farm-Safety-Training-Pack/app as a static site.
# The app folder is the site root, so the app loads at the Pages URL directly.

on:
  push:
    branches:
      - main
      - claude/farm-safety-training-pack-1v08gi
    paths:
      - "Farm-Safety-Training-Pack/app/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Enable Pages automatically on first run if it isn't already.
          enablement: true

      - name: Upload app as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Farm-Safety-Training-Pack/app

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
